# Nix settings for every build in the pinned nixos/nix container. scripts/nix
# mounts this file in place of the image's own config, so local and CI builds
# use the same settings.

# The container isolates the build in place of the Nix sandbox, which would
# need container privileges.
sandbox = false
# The image's own config sets this too. Builds run as the image's nixbld users
# instead of root.
build-users-group = nixbld

experimental-features = nix-command flakes

substituters = https://cache.nixos.org/
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
require-sigs = true
