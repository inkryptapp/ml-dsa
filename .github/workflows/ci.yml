name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # CI never commits, so it doesn't need the Git hook dispatcher.
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The CT-matrix and toolchain tests read upstream's ct-tests.yml at the pin.
          submodules: true
      # The action reads the pnpm version from the `packageManager` field in `package.json`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run coverage

  wasm:
    # Each runner builds its own architecture natively, and both builds must
    # equal the committed module. CI never writes the module.
    name: Rebuild the wasm module on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # The pin guard reads the pin's tag from the submodule's fetched tags.
      - run: git -C vendor/mldsa-native fetch --depth=1 --tags origin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: scripts/check --native-only
      # Each runner packs only its own system, so the tarballs job compares
      # the two tarballs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.runner }}
          path: packages/ml-dsa/packed/*.tgz
          if-no-files-found: error

  tarballs:
    name: Compare the tarballs of both runners
    needs: wasm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          path: tarballs
          merge-multiple: true
      - run: node packages/ml-dsa/check/compare-tarballs.ts tarballs

  consumers:
    # The tarball tests install the packed tarball and load it in the Node.js
    # that runs them, so they run on every maintained Node.js major in range.
    name: Test the tarball on Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pack copies upstream's LICENSE from the submodule.
          submodules: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # The runner image's cached Node.js can lag the newest release.
          check-latest: true
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp test run --silent=false packages/ml-dsa/test/tarball.test.ts
